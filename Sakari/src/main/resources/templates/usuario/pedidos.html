<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Mis Pedidos')}"></head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-content py-4">
        <div class="container">
            <div class="row">
                <!-- Sidebar -->
                <div class="col-lg-4 mb-4">
                    <div class="profile-header">
                        <div class="profile-avatar">
                            <i class="fas fa-user"></i>
                        </div>
                        <h2 th:text="${usuario.nombreCompleto}">Usuario</h2>
                        <p th:text="${usuario.email}">email@example.com</p>
                    </div>
                    <div class="profile-nav">
                        <a th:href="@{/perfil}" class="nav-link">
                            <i class="fas fa-user"></i> Mi Perfil
                        </a>
                        <a th:href="@{/perfil/editar}" class="nav-link">
                            <i class="fas fa-edit"></i> Editar Perfil
                        </a>
                        <a th:href="@{/perfil/cambiar-password}" class="nav-link">
                            <i class="fas fa-lock"></i> Cambiar Contraseña
                        </a>
                        <a th:href="@{/perfil/pedidos}" class="nav-link active">
                            <i class="fas fa-shopping-bag"></i> Mis Pedidos
                        </a>
                    </div>
                </div>

                <!-- Contenido -->
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-header">
                            <i class="fas fa-shopping-bag me-2"></i>Mis Pedidos
                        </div>
                        <div class="card-body">
                            <!-- Sin pedidos -->
                            <div th:if="${pedidos == null or pedidos.isEmpty()}" class="text-center py-5">
                                <i class="fas fa-shopping-bag text-muted mb-3" style="font-size: 3rem; opacity: 0.3;"></i>
                                <h5 class="text-muted">No tienes pedidos todavía</h5>
                                <p class="text-muted small">Cuando realices una compra, aparecerá aquí.</p>
                                <a th:href="@{/productos}" class="btn btn-primary">
                                    <i class="fas fa-shopping-cart me-2"></i>Explorar Productos
                                </a>
                            </div>

                            <!-- Lista de pedidos -->
                            <div th:unless="${pedidos == null or pedidos.isEmpty()}">
                                <div th:each="pedido : ${pedidos}" class="border rounded p-3 mb-3">
                                    <div class="d-flex justify-content-between align-items-start mb-2">
                                        <div>
                                            <h6 class="mb-1">Pedido #<span th:text="${pedido.id}">123</span></h6>
                                            <small class="text-muted" th:text="${#temporals.format(pedido.fecha, 'dd/MM/yyyy HH:mm')}">Fecha</small>
                                        </div>
                                        <span th:class="'badge ' + (${pedido.estado == 'COMPLETADO'} ? 'bg-success' : (${pedido.estado == 'PENDIENTE'} ? 'bg-warning' : 'bg-info'))"
                                              th:text="${pedido.estado}">Estado</span>
                                    </div>
                                    <div class="d-flex justify-content-between align-items-center">
                                        <span class="text-muted small" th:text="${pedido.items?.size() ?: 0} + ' productos'">0 productos</span>
                                        <span class="fw-bold text-primary" th:text="${#numbers.formatDecimal(pedido.total, 0, 'COMMA', 0, 'POINT')} + ' ₡'">0 ₡</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
