<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head th:replace="~{fragments/head :: head('Editar Perfil')}"></head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-content py-4">
        <div class="container">
            <div class="row">
                <!-- Sidebar -->
                <div class="col-lg-4 mb-4">
                    <div class="profile-header">
                        <div class="profile-avatar">
                            <i class="fas fa-user"></i>
                        </div>
                        <h2 th:text="${usuario.nombreCompleto}">Usuario</h2>
                        <p th:text="${usuario.email}">email@example.com</p>
                    </div>
                    <div class="profile-nav">
                        <a th:href="@{/perfil}" class="nav-link">
                            <i class="fas fa-user"></i> Mi Perfil
                        </a>
                        <a th:href="@{/perfil/editar}" class="nav-link active">
                            <i class="fas fa-edit"></i> Editar Perfil
                        </a>
                        <a th:href="@{/perfil/cambiar-password}" class="nav-link">
                            <i class="fas fa-lock"></i> Cambiar Contraseña
                        </a>
                        <a th:href="@{/perfil/pedidos}" class="nav-link">
                            <i class="fas fa-shopping-bag"></i> Mis Pedidos
                        </a>
                    </div>
                </div>

                <!-- Contenido -->
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-header">
                            <i class="fas fa-edit me-2"></i>Editar Información Personal
                        </div>
                        <div class="card-body">
                            <div th:if="${mensaje}" class="alert alert-success">
                                <i class="fas fa-check-circle me-2"></i><span th:text="${mensaje}"></span>
                            </div>
                            <div th:if="${error}" class="alert alert-danger">
                                <i class="fas fa-exclamation-circle me-2"></i><span th:text="${error}"></span>
                            </div>

                            <form th:action="@{/perfil/editar}" th:object="${usuario}" method="post">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label for="nombre" class="form-label">
                                            <i class="fas fa-user me-1 text-primary"></i>Nombre
                                        </label>
                                        <input type="text" id="nombre" th:field="*{nombre}" class="form-control" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="apellido" class="form-label">
                                            <i class="fas fa-user me-1 text-primary"></i>Apellido
                                        </label>
                                        <input type="text" id="apellido" th:field="*{apellido}" class="form-control" required>
                                    </div>
                                    <div class="col-12">
                                        <label for="email" class="form-label">
                                            <i class="fas fa-envelope me-1 text-primary"></i>Correo Electrónico
                                        </label>
                                        <input type="email" id="email" th:field="*{email}" class="form-control" readonly 
                                               style="background-color: var(--gray-100);">
                                        <small class="text-muted">El correo no se puede modificar</small>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="telefono" class="form-label">
                                            <i class="fas fa-phone me-1 text-primary"></i>Teléfono
                                        </label>
                                        <input type="tel" id="telefono" th:field="*{telefono}" class="form-control" 
                                               placeholder="+506 8888-8888">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">
                                            <i class="fas fa-calendar me-1 text-primary"></i>Miembro desde
                                        </label>
                                        <input type="text" class="form-control" readonly 
                                               th:value="${#temporals.format(usuario.fechaRegistro, 'dd/MM/yyyy')}"
                                               style="background-color: var(--gray-100);">
                                    </div>
                                    <div class="col-12">
                                        <label for="direccion" class="form-label">
                                            <i class="fas fa-map-marker-alt me-1 text-primary"></i>Dirección de Envío
                                        </label>
                                        <textarea id="direccion" th:field="*{direccion}" class="form-control" rows="2" 
                                                  placeholder="Dirección completa para envíos"></textarea>
                                    </div>
                                    <div class="col-12">
                                        <hr class="my-3">
                                        <div class="d-flex gap-2 flex-wrap">
                                            <button type="submit" class="btn btn-primary">
                                                <i class="fas fa-save me-2"></i>Guardar Cambios
                                            </button>
                                            <a th:href="@{/perfil}" class="btn btn-secondary">
                                                <i class="fas fa-times me-2"></i>Cancelar
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
