<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head th:replace="~{fragments/head :: head('Cambiar Contraseña')}"></head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-content py-4">
        <div class="container">
            <div class="row">
                <!-- Sidebar -->
                <div class="col-lg-4 mb-4">
                    <div class="profile-header">
                        <div class="profile-avatar">
                            <i class="fas fa-user"></i>
                        </div>
                        <h2 th:text="${usuario.nombreCompleto}">Usuario</h2>
                        <p th:text="${usuario.email}">email@example.com</p>
                    </div>
                    <div class="profile-nav">
                        <a th:href="@{/perfil}" class="nav-link">
                            <i class="fas fa-user"></i> Mi Perfil
                        </a>
                        <a th:href="@{/perfil/editar}" class="nav-link">
                            <i class="fas fa-edit"></i> Editar Perfil
                        </a>
                        <a th:href="@{/perfil/cambiar-password}" class="nav-link active">
                            <i class="fas fa-lock"></i> Cambiar Contraseña
                        </a>
                        <a th:href="@{/perfil/pedidos}" class="nav-link">
                            <i class="fas fa-shopping-bag"></i> Mis Pedidos
                        </a>
                    </div>
                </div>

                <!-- Contenido -->
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-header">
                            <i class="fas fa-lock me-2"></i>Cambiar Contraseña
                        </div>
                        <div class="card-body">
                            <div th:if="${mensaje}" class="alert alert-success">
                                <i class="fas fa-check-circle me-2"></i><span th:text="${mensaje}"></span>
                            </div>
                            <div th:if="${error}" class="alert alert-danger">
                                <i class="fas fa-exclamation-circle me-2"></i><span th:text="${error}"></span>
                            </div>

                            <div class="alert alert-info mb-4">
                                <i class="fas fa-info-circle me-2"></i>
                                <strong>Consejos para una contraseña segura:</strong>
                                <ul class="mb-0 mt-2" style="font-size: 0.85rem;">
                                    <li>Mínimo 6 caracteres</li>
                                    <li>Combina letras mayúsculas y minúsculas</li>
                                    <li>Incluye números y símbolos</li>
                                    <li>No uses información personal fácil de adivinar</li>
                                </ul>
                            </div>

                            <form th:action="@{/perfil/cambiar-password}" method="post" id="passwordForm">
                                <div class="row g-3">
                                    <div class="col-12">
                                        <label for="passwordActual" class="form-label">
                                            <i class="fas fa-key me-1 text-primary"></i>Contraseña Actual
                                        </label>
                                        <div class="input-group">
                                            <input type="password" id="passwordActual" name="passwordActual" 
                                                   class="form-control" required placeholder="Tu contraseña actual">
                                            <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('passwordActual')">
                                                <i class="fas fa-eye"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="passwordNueva" class="form-label">
                                            <i class="fas fa-lock me-1 text-primary"></i>Nueva Contraseña
                                        </label>
                                        <div class="input-group">
                                            <input type="password" id="passwordNueva" name="passwordNueva" 
                                                   class="form-control" required minlength="6" 
                                                   placeholder="Mínimo 6 caracteres">
                                            <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('passwordNueva')">
                                                <i class="fas fa-eye"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="confirmarPassword" class="form-label">
                                            <i class="fas fa-lock me-1 text-primary"></i>Confirmar Contraseña
                                        </label>
                                        <div class="input-group">
                                            <input type="password" id="confirmarPassword" name="confirmarPassword" 
                                                   class="form-control" required minlength="6" 
                                                   placeholder="Repite la contraseña">
                                            <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('confirmarPassword')">
                                                <i class="fas fa-eye"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <div id="passwordMatch" class="small" style="display: none;"></div>
                                    </div>
                                    <div class="col-12">
                                        <hr class="my-3">
                                        <div class="d-flex gap-2 flex-wrap">
                                            <button type="submit" class="btn btn-primary">
                                                <i class="fas fa-save me-2"></i>Actualizar Contraseña
                                            </button>
                                            <a th:href="@{/perfil}" class="btn btn-secondary">
                                                <i class="fas fa-times me-2"></i>Cancelar
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.nextElementSibling.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        document.getElementById('confirmarPassword').addEventListener('input', function() {
            const nueva = document.getElementById('passwordNueva').value;
            const confirmar = this.value;
            const matchDiv = document.getElementById('passwordMatch');
            
            if (confirmar.length > 0) {
                matchDiv.style.display = 'block';
                if (nueva === confirmar) {
                    matchDiv.innerHTML = '<i class="fas fa-check-circle text-success me-1"></i>Las contraseñas coinciden';
                    matchDiv.className = 'small text-success';
                } else {
                    matchDiv.innerHTML = '<i class="fas fa-times-circle text-danger me-1"></i>Las contraseñas no coinciden';
                    matchDiv.className = 'small text-danger';
                }
            } else {
                matchDiv.style.display = 'none';
            }
        });

        document.getElementById('passwordForm').addEventListener('submit', function(e) {
            const nueva = document.getElementById('passwordNueva').value;
            const confirmar = document.getElementById('confirmarPassword').value;
            
            if (nueva !== confirmar) {
                e.preventDefault();
                alert('Las contraseñas no coinciden');
                return false;
            }
            
            if (nueva.length < 6) {
                e.preventDefault();
                alert('La contraseña debe tener al menos 6 caracteres');
                return false;
            }
        });
    </script>
</body>
</html>
