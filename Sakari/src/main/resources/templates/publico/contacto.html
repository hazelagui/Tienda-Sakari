<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Contacto')}"></head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <section class="page-header">
        <div class="container">
            <h1><i class="fas fa-envelope me-2"></i>Contáctanos</h1>
            <p>Estamos aquí para ayudarte</p>
        </div>
    </section>

    <main class="main-content py-4">
        <div class="container">
            <div class="row g-4">
                <!-- Formulario -->
                <div class="col-lg-7">
                    <div class="card">
                        <div class="card-header">
                            <i class="fas fa-paper-plane me-2"></i>Envíanos un Mensaje
                        </div>
                        <div class="card-body">
                            <div th:if="${mensaje}" class="alert alert-success">
                                <i class="fas fa-check-circle me-2"></i>
                                <span th:text="${mensaje}"></span>
                            </div>
                            
                            <div th:if="${error}" class="alert alert-danger">
                                <i class="fas fa-exclamation-circle me-2"></i>
                                <span th:text="${error}"></span>
                            </div>
                            
                            <form th:action="@{/contacto}" method="post">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label for="nombre" class="form-label">Nombre *</label>
                                        <input type="text" id="nombre" name="nombre" class="form-control" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="email" class="form-label">Correo *</label>
                                        <input type="email" id="email" name="email" class="form-control" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="telefono" class="form-label">Teléfono</label>
                                        <input type="tel" id="telefono" name="telefono" class="form-control">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="asunto" class="form-label">Asunto *</label>
                                        <select id="asunto" name="asunto" class="form-select" required>
                                            <option value="">Seleccionar...</option>
                                            <option value="Cotización">Cotización</option>
                                            <option value="Pedido">Consulta de pedido</option>
                                            <option value="Producto">Información de producto</option>
                                            <option value="Otro">Otro</option>
                                        </select>
                                    </div>
                                    <div class="col-12">
                                        <label for="mensaje" class="form-label">Mensaje *</label>
                                        <textarea id="mensaje" name="mensaje" class="form-control" rows="4" required></textarea>
                                    </div>
                                    <div class="col-12">
                                        <button type="submit" class="btn btn-primary btn-lg w-100">
                                            <i class="fas fa-paper-plane me-2"></i>Enviar Mensaje
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
                
                <!-- Info de contacto -->
                <div class="col-lg-5">
                    <div class="contact-info-card mb-3">
                        <h5 class="mb-3 fw-bold"><i class="fas fa-info-circle me-2 text-primary"></i>Información</h5>
                        
                        <div class="contact-item">
                            <div class="contact-icon"><i class="fas fa-map-marker-alt"></i></div>
                            <div>
                                <h4>Ubicación</h4>
                                <p>La Aurora, Heredia, Costa Rica</p>
                            </div>
                        </div>
                        
                        <div class="contact-item">
                            <div class="contact-icon"><i class="fas fa-phone"></i></div>
                            <div>
                                <h4>Teléfono</h4>
                                <p>+506 8873-5743</p>
                            </div>
                        </div>
                        
                        <div class="contact-item">
                            <div class="contact-icon"><i class="fas fa-envelope"></i></div>
                            <div>
                                <h4>Email</h4>
                                <p>info@sakari.cr</p>
                            </div>
                        </div>
                        
                        <div class="contact-item">
                            <div class="contact-icon"><i class="fas fa-clock"></i></div>
                            <div>
                                <h4>Horario</h4>
                                <p>Lun - Sáb: 8:00 AM - 6:00 PM</p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Redes Sociales -->
                    <div class="card">
                        <div class="card-body text-center py-4">
                            <h5 class="fw-bold mb-3">Síguenos</h5>
                            <div class="social-grid">
                                <a href="#" class="social-btn facebook" title="Facebook">
                                    <i class="fab fa-facebook-f"></i>
                                </a>
                                <a href="#" class="social-btn instagram" title="Instagram">
                                    <i class="fab fa-instagram"></i>
                                </a>
                                <a href="https://wa.me/50688735743" target="_blank" class="social-btn whatsapp" title="WhatsApp">
                                    <i class="fab fa-whatsapp"></i>
                                </a>
                                <a href="#" class="social-btn tiktok" title="TikTok">
                                    <i class="fab fa-tiktok"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
