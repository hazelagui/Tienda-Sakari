<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Mi Carrito')}"></head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <section class="page-header">
        <div class="container">
            <h1><i class="fas fa-shopping-cart me-2"></i>Mi Carrito</h1>
            <p>Revisa tus productos antes de comprar</p>
        </div>
    </section>

    <main class="main-content py-4">
        <div class="container">
            <div th:if="${mensaje}" class="alert alert-success">
                <i class="fas fa-check-circle me-2"></i><span th:text="${mensaje}"></span>
            </div>
            <div th:if="${error}" class="alert alert-danger">
                <i class="fas fa-exclamation-circle me-2"></i><span th:text="${error}"></span>
            </div>

            <!-- Carrito vacío -->
            <div th:if="${carrito.items == null or carrito.items.isEmpty()}" class="empty-state">
                <i class="fas fa-shopping-cart"></i>
                <h2>Tu carrito está vacío</h2>
                <p>Agrega productos para comenzar tu compra</p>
                <a th:href="@{/productos}" class="btn btn-primary">
                    <i class="fas fa-shopping-bag me-2"></i>Ver Productos
                </a>
            </div>

            <!-- Carrito con productos -->
            <div th:unless="${carrito.items == null or carrito.items.isEmpty()}" class="row g-4">
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <span><i class="fas fa-list me-2"></i>Productos (<span th:text="${carrito.items.size()}">0</span>)</span>
                            <form th:action="@{/carrito/limpiar}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger" 
                                        onclick="return confirm('¿Vaciar el carrito?')">
                                    <i class="fas fa-trash me-1"></i>Vaciar
                                </button>
                            </form>
                        </div>
                        <div class="card-body p-0">
                            <div th:each="item : ${carrito.items}" class="cart-item p-3 border-bottom">
                                <div class="row align-items-center">
                                    <div class="col-3 col-md-2">
                                        <img th:src="${item.producto.imagenUrl}" th:alt="${item.producto.nombre}" 
                                             class="img-fluid rounded" style="max-height: 80px; object-fit: cover;"
                                             onerror="this.src='https://via.placeholder.com/100x100?text=Sakari'">
                                    </div>
                                    <div class="col-9 col-md-4">
                                        <h6 class="mb-1" th:text="${item.producto.nombre}">Producto</h6>
                                        <small class="text-muted" th:text="${item.producto.categoria?.nombre}">Categoría</small>
                                        <p th:if="${item.personalizacion}" class="mb-0 mt-1">
                                            <small class="text-primary"><i class="fas fa-magic me-1"></i><span th:text="${item.personalizacion}"></span></small>
                                        </p>
                                    </div>
                                    <div class="col-6 col-md-2 mt-2 mt-md-0">
                                        <form th:action="@{/carrito/actualizar}" method="post" class="d-flex align-items-center gap-1">
                                            <input type="hidden" name="itemId" th:value="${item.id}">
                                            <button type="submit" name="cantidad" th:value="${item.cantidad - 1}" class="btn btn-sm btn-outline-secondary">−</button>
                                            <span class="px-2 fw-bold" th:text="${item.cantidad}">1</span>
                                            <button type="submit" name="cantidad" th:value="${item.cantidad + 1}" class="btn btn-sm btn-outline-secondary">+</button>
                                        </form>
                                    </div>
                                    <div class="col-4 col-md-2 mt-2 mt-md-0 text-end">
                                        <span class="fw-bold text-primary" th:text="${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')} + ' ₡'">0 ₡</span>
                                    </div>
                                    <div class="col-2 col-md-2 mt-2 mt-md-0 text-end">
                                        <form th:action="@{/carrito/eliminar/{id}(id=${item.id})}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar">
                                                <i class="fas fa-times"></i>
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Resumen -->
                <div class="col-lg-4">
                    <div class="card">
                        <div class="card-header">
                            <i class="fas fa-receipt me-2"></i>Resumen
                        </div>
                        <div class="card-body">
                            <div class="d-flex justify-content-between mb-2">
                                <span>Subtotal</span>
                                <span th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 0, 'POINT')} + ' ₡'">0 ₡</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Envío</span>
                                <span class="text-success">Por calcular</span>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between mb-3">
                                <span class="fw-bold">Total</span>
                                <span class="fw-bold text-primary fs-5" th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 0, 'POINT')} + ' ₡'">0 ₡</span>
                            </div>
                            <a th:href="@{/carrito/checkout}" class="btn btn-primary w-100 mb-2">
                                <i class="fas fa-credit-card me-2"></i>Confirmar Pedido
                            </a>
                            <a th:href="@{/productos}" class="btn btn-secondary w-100">
                                <i class="fas fa-arrow-left me-2"></i>Seguir Comprando
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script>
        // Actualizar badge del carrito
        function actualizarBadge() {
            fetch('/carrito/count')
                .then(r => r.json())
                .then(count => {
                    const badge = document.getElementById('cartCount');
                    if (badge) {
                        badge.textContent = count;
                        badge.style.display = count > 0 ? 'flex' : 'none';
                    }
                });
        }
        document.addEventListener('DOMContentLoaded', actualizarBadge);
    </script>
</body>
</html>
