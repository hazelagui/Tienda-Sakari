<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Admin Sakari</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <th:block th:replace="~{admin/fragments/admin-layout :: styles}"></th:block>
</head>
<body>
    <div class="admin-container">
        <th:block th:replace="~{admin/fragments/admin-layout :: sidebar('usuarios')}"></th:block>
        
        <main class="admin-content">
            <h1 class="page-title"><i class="fas fa-users"></i> Usuarios</h1>

            <div th:if="${mensaje}" class="alert alert-success">
                <i class="fas fa-check-circle"></i> <span th:text="${mensaje}"></span>
            </div>

            <div class="admin-card">
                <div class="admin-card-body" style="padding: 0;">
                    <table class="admin-table" th:if="${usuarios != null && !usuarios.isEmpty()}">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Rol</th>
                                <th>Estado</th>
                                <th>Registro</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="usuario : ${usuarios}">
                                <td th:text="${usuario.id}">#</td>
                                <td><strong th:text="${usuario.nombre + ' ' + usuario.apellido}">Usuario</strong></td>
                                <td th:text="${usuario.email}">email@example.com</td>
                                <td>
                                    <span th:class="${usuario.rol == 'ADMIN' ? 'badge badge-warning' : 'badge badge-info'}"
                                          th:text="${usuario.rol}">Rol</span>
                                </td>
                                <td>
                                    <span th:class="${usuario.activo ? 'badge badge-success' : 'badge badge-danger'}"
                                          th:text="${usuario.activo ? 'Activo' : 'Inactivo'}">Estado</span>
                                </td>
                                <td th:text="${#temporals.format(usuario.fechaRegistro, 'dd/MM/yyyy')}">Fecha</td>
                                <td>
                                    <a th:href="@{/admin/usuarios/{id}(id=${usuario.id})}" class="btn btn-sm btn-secondary">
                                        <i class="fas fa-eye"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div th:if="${usuarios == null || usuarios.isEmpty()}" class="empty-state">
                        <i class="fas fa-users"></i>
                        <p>No hay usuarios registrados</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
