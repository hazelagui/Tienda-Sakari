<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Usuario - Admin Sakari</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <th:block th:replace="~{admin/fragments/admin-layout :: styles}"></th:block>
</head>
<body>
    <div class="admin-container">
        <th:block th:replace="~{admin/fragments/admin-layout :: sidebar('usuarios')}"></th:block>
        
        <main class="admin-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h1 class="page-title" style="margin-bottom: 0;">
                    <i class="fas fa-user"></i> <span th:text="${usuario.nombre + ' ' + usuario.apellido}">Usuario</span>
                </h1>
                <a th:href="@{/admin/usuarios}" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Volver
                </a>
            </div>

            <div th:if="${mensaje}" class="alert alert-success">
                <i class="fas fa-check-circle"></i> <span th:text="${mensaje}"></span>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                <!-- Info del usuario -->
                <div class="admin-card">
                    <div class="admin-card-header">
                        <h3><i class="fas fa-info-circle"></i> Información Personal</h3>
                    </div>
                    <div class="admin-card-body">
                        <div class="info-grid">
                            <div class="info-item">
                                <label>Nombre Completo</label>
                                <span th:text="${usuario.nombre + ' ' + usuario.apellido}">Nombre</span>
                            </div>
                            <div class="info-item">
                                <label>Email</label>
                                <span th:text="${usuario.email}">email@example.com</span>
                            </div>
                            <div class="info-item">
                                <label>Teléfono</label>
                                <span th:text="${usuario.telefono ?: 'No registrado'}">Tel</span>
                            </div>
                            <div class="info-item">
                                <label>Dirección</label>
                                <span th:text="${usuario.direccion ?: 'No registrada'}">Dir</span>
                            </div>
                            <div class="info-item">
                                <label>Fecha Registro</label>
                                <span th:text="${#temporals.format(usuario.fechaRegistro, 'dd/MM/yyyy HH:mm')}">Fecha</span>
                            </div>
                            <div class="info-item">
                                <label>Estado</label>
                                <span th:class="${usuario.activo ? 'badge badge-success' : 'badge badge-danger'}"
                                      th:text="${usuario.activo ? 'Activo' : 'Inactivo'}">Estado</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Acciones -->
                <div class="admin-card">
                    <div class="admin-card-header">
                        <h3><i class="fas fa-cog"></i> Acciones</h3>
                    </div>
                    <div class="admin-card-body">
                        <div style="display: flex; flex-direction: column; gap: 1rem;">
                            <div>
                                <label class="form-label">Rol del Usuario</label>
                                <form th:action="@{/admin/usuarios/{id}/rol(id=${usuario.id})}" method="post" 
                                      style="display: flex; gap: 0.5rem;">
                                    <select name="rol" class="form-select">
                                        <option value="USER" th:selected="${usuario.rol == 'USER'}">Usuario</option>
                                        <option value="ADMIN" th:selected="${usuario.rol == 'ADMIN'}">Administrador</option>
                                    </select>
                                    <button type="submit" class="btn btn-primary btn-sm">Cambiar</button>
                                </form>
                            </div>
                            <div>
                                <label class="form-label">Estado de la Cuenta</label>
                                <form th:action="@{/admin/usuarios/{id}/estado(id=${usuario.id})}" method="post">
                                    <button type="submit" th:class="${usuario.activo ? 'btn btn-danger' : 'btn btn-success'}">
                                        <i th:class="${usuario.activo ? 'fas fa-ban' : 'fas fa-check'}"></i>
                                        <span th:text="${usuario.activo ? 'Desactivar Cuenta' : 'Activar Cuenta'}">Acción</span>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Pedidos del usuario -->
            <div class="admin-card" style="margin-top: 1.5rem;">
                <div class="admin-card-header">
                    <h3><i class="fas fa-shopping-bag"></i> Pedidos del Usuario</h3>
                </div>
                <div class="admin-card-body" style="padding: 0;">
                    <table class="admin-table" th:if="${pedidos != null && !pedidos.isEmpty()}">
                        <thead>
                            <tr>
                                <th>Nº Pedido</th>
                                <th>Total</th>
                                <th>Estado</th>
                                <th>Fecha</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="pedido : ${pedidos}">
                                <td th:text="${pedido.numeroPedido}">PED-XXX</td>
                                <td th:text="${#numbers.formatDecimal(pedido.total, 0, 'COMMA', 0, 'POINT')} + ' ₡'">0 ₡</td>
                                <td>
                                    <span th:class="'badge badge-' + ${pedido.estado.name().toLowerCase()}"
                                          th:text="${pedido.estado}">Estado</span>
                                </td>
                                <td th:text="${#temporals.format(pedido.fechaPedido, 'dd/MM/yyyy')}">Fecha</td>
                                <td>
                                    <a th:href="@{/admin/pedidos/{id}(id=${pedido.id})}" class="btn btn-sm btn-secondary">
                                        <i class="fas fa-eye"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div th:if="${pedidos == null || pedidos.isEmpty()}" class="empty-state">
                        <i class="fas fa-shopping-bag"></i>
                        <p>Este usuario no tiene pedidos</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
