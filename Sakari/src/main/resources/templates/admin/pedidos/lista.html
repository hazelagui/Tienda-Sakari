<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - Admin Sakari</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <th:block th:replace="~{admin/fragments/admin-layout :: styles}"></th:block>
</head>
<body>
    <div class="admin-container">
        <th:block th:replace="~{admin/fragments/admin-layout :: sidebar('pedidos')}"></th:block>
        
        <main class="admin-content">
            <h1 class="page-title"><i class="fas fa-shopping-cart"></i> Pedidos</h1>

            <div th:if="${mensaje}" class="alert alert-success">
                <i class="fas fa-check-circle"></i> <span th:text="${mensaje}"></span>
            </div>

            <div class="admin-card">
                <div class="admin-card-body" style="padding: 0;">
                    <table class="admin-table" th:if="${pedidos != null && !pedidos.isEmpty()}">
                        <thead>
                            <tr>
                                <th>Nº Pedido</th>
                                <th>Cliente</th>
                                <th>Email</th>
                                <th>Total</th>
                                <th>Estado</th>
                                <th>Fecha</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="pedido : ${pedidos}">
                                <td><strong th:text="${pedido.numeroPedido}">PED-XXX</strong></td>
                                <td th:text="${pedido.usuario.nombre + ' ' + pedido.usuario.apellido}">Cliente</td>
                                <td th:text="${pedido.usuario.email}">email@example.com</td>
                                <td th:text="${#numbers.formatDecimal(pedido.total, 0, 'COMMA', 0, 'POINT')} + ' ₡'">0 ₡</td>
                                <td>
                                    <span th:class="'badge badge-' + ${pedido.estado.name().toLowerCase()}"
                                          th:text="${pedido.estado}">Estado</span>
                                </td>
                                <td th:text="${#temporals.format(pedido.fechaPedido, 'dd/MM/yyyy HH:mm')}">Fecha</td>
                                <td>
                                    <a th:href="@{/admin/pedidos/{id}(id=${pedido.id})}" class="btn btn-sm btn-secondary">
                                        <i class="fas fa-eye"></i> Ver
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div th:if="${pedidos == null || pedidos.isEmpty()}" class="empty-state">
                        <i class="fas fa-shopping-cart"></i>
                        <p>No hay pedidos registrados</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
