<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensajes - Admin Sakari</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <th:block th:replace="~{admin/fragments/admin-layout :: styles}"></th:block>
</head>
<body>
    <div class="admin-container">
        <th:block th:replace="~{admin/fragments/admin-layout :: sidebar('mensajes')}"></th:block>
        
        <main class="admin-content">
            <h1 class="page-title"><i class="fas fa-envelope"></i> Mensajes de Contacto</h1>

            <div th:if="${mensaje}" class="alert alert-success">
                <i class="fas fa-check-circle"></i> <span th:text="${mensaje}"></span>
            </div>

            <div class="admin-card">
                <div class="admin-card-body" style="padding: 0;">
                    <table class="admin-table" th:if="${mensajes != null && !mensajes.isEmpty()}">
                        <thead>
                            <tr>
                                <th>Estado</th>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Asunto</th>
                                <th>Fecha</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="msg : ${mensajes}" th:style="${!msg.leido ? 'background: #EFF6FF;' : ''}">
                                <td>
                                    <span th:class="${msg.leido ? 'badge badge-success' : 'badge badge-warning'}"
                                          th:text="${msg.leido ? 'Leído' : 'Nuevo'}">Estado</span>
                                </td>
                                <td>
                                    <strong th:text="${msg.nombre}">Nombre</strong>
                                </td>
                                <td th:text="${msg.email}">email@example.com</td>
                                <td th:text="${msg.asunto}">Asunto</td>
                                <td th:text="${#temporals.format(msg.fechaEnvio, 'dd/MM/yyyy HH:mm')}">Fecha</td>
                                <td>
                                    <a th:href="@{/admin/mensajes/{id}(id=${msg.id})}" class="btn btn-sm btn-secondary">
                                        <i class="fas fa-eye"></i> Ver
                                    </a>
                                    <form th:action="@{/admin/mensajes/eliminar/{id}(id=${msg.id})}" method="post" 
                                          style="display: inline;" onsubmit="return confirm('¿Eliminar este mensaje?')">
                                        <button type="submit" class="btn btn-sm btn-danger"><i class="fas fa-trash"></i></button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div th:if="${mensajes == null || mensajes.isEmpty()}" class="empty-state">
                        <i class="fas fa-envelope-open"></i>
                        <p>No hay mensajes</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
