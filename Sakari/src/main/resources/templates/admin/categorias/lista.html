<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorías - Admin Sakari</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <th:block th:replace="~{admin/fragments/admin-layout :: styles}"></th:block>
</head>
<body>
    <div class="admin-container">
        <th:block th:replace="~{admin/fragments/admin-layout :: sidebar('categorias')}"></th:block>
        
        <main class="admin-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h1 class="page-title" style="margin-bottom: 0;"><i class="fas fa-tags"></i> Categorías</h1>
                <a th:href="@{/admin/categorias/nueva}" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Nueva Categoría
                </a>
            </div>

            <div th:if="${mensaje}" class="alert alert-success">
                <i class="fas fa-check-circle"></i> <span th:text="${mensaje}"></span>
            </div>

            <div class="admin-card">
                <div class="admin-card-body" style="padding: 0;">
                    <table class="admin-table" th:if="${categorias != null && !categorias.isEmpty()}">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Descripción</th>
                                <th>Productos</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="categoria : ${categorias}">
                                <td th:text="${categoria.id}">#</td>
                                <td><strong th:text="${categoria.nombre}">Categoría</strong></td>
                                <td th:text="${categoria.descripcion ?: '-'}">Descripción</td>
                                <td><span class="badge badge-info" th:text="${categoria.productos?.size() ?: 0}">0</span></td>
                                <td>
                                    <a th:href="@{/admin/categorias/editar/{id}(id=${categoria.id})}" class="btn btn-sm btn-secondary">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <form th:action="@{/admin/categorias/eliminar/{id}(id=${categoria.id})}" method="post" 
                                          style="display: inline;" onsubmit="return confirm('¿Eliminar esta categoría?')">
                                        <button type="submit" class="btn btn-sm btn-danger"><i class="fas fa-trash"></i></button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div th:if="${categorias == null || categorias.isEmpty()}" class="empty-state">
                        <i class="fas fa-tags"></i>
                        <p>No hay categorías registradas</p>
                        <a th:href="@{/admin/categorias/nueva}" class="btn btn-primary">Crear Primera Categoría</a>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
