<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${producto.id != null ? 'Editar' : 'Nuevo'} + ' Producto - Admin Sakari'">Producto - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <th:block th:replace="~{admin/fragments/admin-layout :: styles}"></th:block>
</head>
<body>
    <div class="admin-container">
        <th:block th:replace="~{admin/fragments/admin-layout :: sidebar('productos')}"></th:block>
        
        <main class="admin-content">
            <h1 class="page-title">
                <i class="fas fa-box"></i> 
                <span th:text="${producto.id != null ? 'Editar Producto' : 'Nuevo Producto'}">Producto</span>
            </h1>

            <div th:if="${error}" class="alert alert-danger">
                <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
            </div>

            <div class="admin-card">
                <div class="admin-card-body">
                    <form th:action="${producto.id != null ? '/admin/productos/editar/' + producto.id : '/admin/productos/nuevo'}" 
                          method="post" th:object="${producto}">
                        
                        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem;">
                            <div>
                                <label class="form-label">Nombre *</label>
                                <input type="text" th:field="*{nombre}" class="form-control" required>
                            </div>
                            <div>
                                <label class="form-label">Categoría *</label>
                                <select name="categoriaId" class="form-select" required>
                                    <option value="">Seleccionar categoría</option>
                                    <option th:each="cat : ${categorias}" 
                                            th:value="${cat.id}" 
                                            th:text="${cat.nombre}"
                                            th:selected="${producto.categoria != null and producto.categoria.id == cat.id}">Cat</option>
                                </select>
                            </div>
                            <div>
                                <label class="form-label">(₡)Precio *</label>
                                <input type="number" th:field="*{precio}" class="form-control" step="0.01" min="0" required>
                            </div>
                            <div>
                                <label class="form-label">Stock *</label>
                                <input type="number" th:field="*{stock}" class="form-control" min="0" required>
                            </div>
                            <div style="grid-column: span 2;">
                                <label class="form-label">URL de Imagen</label>
                                <input type="url" th:field="*{imagenUrl}" class="form-control" placeholder="https://...">
                            </div>
                            <div style="grid-column: span 2;">
                                <label class="form-label">Descripción</label>
                                <textarea th:field="*{descripcion}" class="form-control" rows="3"></textarea>
                            </div>
                            <div>
                                <label class="form-check">
                                    <input type="checkbox" th:field="*{personalizable}" class="form-check-input">
                                    <span>Personalizable</span>
                                </label>
                            </div>
                            <div>
                                <label class="form-check">
                                    <input type="checkbox" th:field="*{activo}" class="form-check-input">
                                    <span>Activo</span>
                                </label>
                            </div>
                        </div>

                        <div style="margin-top: 1.5rem; display: flex; gap: 0.5rem;">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Guardar
                            </button>
                            <a th:href="@{/admin/productos}" class="btn btn-secondary">
                                <i class="fas fa-times"></i> Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
