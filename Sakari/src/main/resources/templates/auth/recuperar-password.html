<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Recuperar Contraseña')}"></head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-content py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card shadow">
                        <div class="card-body p-4">
                            <div class="text-center mb-4">
                                <i class="fas fa-key fa-3x text-primary mb-3"></i>
                                <h2 class="h4">Recuperar Contraseña</h2>
                                <p class="text-muted">
                                    Ingresa tu correo electrónico y te enviaremos instrucciones para restablecer tu contraseña.
                                </p>
                            </div>

                            <div th:if="${mensaje}" class="alert alert-success">
                                <i class="fas fa-check-circle me-2"></i>
                                <span th:text="${mensaje}"></span>
                            </div>

                            <div th:if="${error}" class="alert alert-danger">
                                <i class="fas fa-exclamation-circle me-2"></i>
                                <span th:text="${error}"></span>
                            </div>

                            <form th:action="@{/recuperar-password}" method="post">
                                <div class="mb-3">
                                    <label for="email" class="form-label">
                                        <i class="fas fa-envelope me-1"></i> Correo Electrónico
                                    </label>
                                    <input type="email" class="form-control" id="email" name="email" 
                                           required placeholder="tu@email.com" autocomplete="email">
                                </div>

                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="fas fa-paper-plane me-1"></i> Enviar Instrucciones
                                </button>
                            </form>

                            <hr class="my-4">
                            
                            <div class="text-center">
                                <p class="mb-2">¿Recordaste tu contraseña? 
                                    <a th:href="@{/login}" class="text-decoration-none">Iniciar Sesión</a>
                                </p>
                                <p class="mb-0">¿No tienes cuenta? 
                                    <a th:href="@{/registro}" class="text-decoration-none">Regístrate aquí</a>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
