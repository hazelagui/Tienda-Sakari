<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Registro')}"></head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-content py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card border-0 shadow-lg">
                        <div class="card-body p-5">
                            <div class="text-center mb-4">
                                <div class="mb-3">
                                    <i class="fas fa-user-plus fa-4x" style="color: var(--primary-color);"></i>
                                </div>
                                <h2 class="fw-bold">Crear Cuenta</h2>
                                <p class="text-muted">Únete a la familia Sakari</p>
                            </div>
                            
                            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                                <i class="fas fa-exclamation-circle me-2"></i>
                                <span th:text="${error}"></span>
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                            
                            <form th:action="@{/registro}" th:object="${usuario}" method="post" id="registroForm">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label for="nombre" class="form-label fw-semibold">
                                            <i class="fas fa-user me-1"></i> Nombre *
                                        </label>
                                        <input type="text" id="nombre" th:field="*{nombre}" class="form-control" 
                                               placeholder="Tu nombre" required>
                                    </div>
                                    
                                    <div class="col-md-6">
                                        <label for="apellido" class="form-label fw-semibold">
                                            <i class="fas fa-user me-1"></i> Apellido *
                                        </label>
                                        <input type="text" id="apellido" th:field="*{apellido}" class="form-control" 
                                               placeholder="Tu apellido" required>
                                    </div>
                                    
                                    <div class="col-12">
                                        <label for="email" class="form-label fw-semibold">
                                            <i class="fas fa-envelope me-1"></i> Correo Electrónico *
                                        </label>
                                        <input type="email" id="email" th:field="*{email}" class="form-control" 
                                               placeholder="tu@email.com" required>
                                    </div>
                                    
                                    <div class="col-12">
                                        <label for="telefono" class="form-label fw-semibold">
                                            <i class="fas fa-phone me-1"></i> Teléfono
                                        </label>
                                        <input type="tel" id="telefono" th:field="*{telefono}" class="form-control" 
                                               placeholder="+506 8888-8888">
                                    </div>
                                    
                                    <div class="col-12">
                                        <label for="direccion" class="form-label fw-semibold">
                                            <i class="fas fa-map-marker-alt me-1"></i> Dirección
                                        </label>
                                        <input type="text" id="direccion" th:field="*{direccion}" class="form-control" 
                                               placeholder="Tu dirección de envío">
                                    </div>
                                    
                                    <div class="col-md-6">
                                        <label for="password" class="form-label fw-semibold">
                                            <i class="fas fa-lock me-1"></i> Contraseña *
                                        </label>
                                        <input type="password" id="password" th:field="*{password}" class="form-control" 
                                               placeholder="Mínimo 6 caracteres" required minlength="6">
                                    </div>
                                    
                                    <div class="col-md-6">
                                        <label for="confirmarPassword" class="form-label fw-semibold">
                                            <i class="fas fa-lock me-1"></i> Confirmar Contraseña *
                                        </label>
                                        <input type="password" id="confirmarPassword" name="confirmarPassword" class="form-control" 
                                               placeholder="Repite tu contraseña" required minlength="6">
                                    </div>
                                    
                                    <div class="col-12">
                                        <div class="form-check">
                                            <input type="checkbox" id="terminos" class="form-check-input" required>
                                            <label for="terminos" class="form-check-label">
                                                Acepto los <a th:href="@{/terminos-condiciones}" target="_blank" style="color: var(--primary-color);">Términos y Condiciones</a> 
                                                y la <a th:href="@{/politicas-privacidad}" target="_blank" style="color: var(--primary-color);">Política de Privacidad</a>
                                            </label>
                                        </div>
                                    </div>
                                    
                                    <div class="col-12">
                                        <button type="submit" class="btn btn-primary btn-lg w-100">
                                            <i class="fas fa-user-plus me-2"></i> Crear Cuenta
                                        </button>
                                    </div>
                                </div>
                            </form>
                            
                            <hr class="my-4">
                            
                            <div class="text-center">
                                <p class="text-muted mb-0">
                                    ¿Ya tienes cuenta? 
                                    <a th:href="@{/login}" class="fw-bold text-decoration-none" style="color: var(--primary-color);">
                                        Inicia sesión aquí
                                    </a>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script>
        document.getElementById('registroForm').addEventListener('submit', function(e) {
            const password = document.getElementById('password').value;
            const confirmar = document.getElementById('confirmarPassword').value;
            if (password !== confirmar) {
                e.preventDefault();
                alert('Las contraseñas no coinciden');
                return false;
            }
            if (password.length < 6) {
                e.preventDefault();
                alert('La contraseña debe tener al menos 6 caracteres');
                return false;
            }
            return true;
        });
    </script>
</body>
</html>
