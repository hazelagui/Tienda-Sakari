<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Nueva Contraseña')}"></head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-content py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card shadow">
                        <div class="card-body p-4">
                            <div class="text-center mb-4">
                                <i class="fas fa-lock fa-3x text-primary mb-3"></i>
                                <h2 class="h4">Nueva Contraseña</h2>
                                <p class="text-muted">Ingresa tu nueva contraseña</p>
                            </div>

                            <div th:if="${error}" class="alert alert-danger">
                                <i class="fas fa-exclamation-circle me-2"></i>
                                <span th:text="${error}"></span>
                            </div>

                            <form th:action="@{/reset-password}" method="post" id="resetForm">
                                <input type="hidden" name="token" th:value="${token}">
                                
                                <div class="mb-3">
                                    <label for="password" class="form-label">
                                        <i class="fas fa-lock me-1"></i> Nueva Contraseña
                                    </label>
                                    <input type="password" class="form-control" id="password" name="password" 
                                           required placeholder="Mínimo 6 caracteres" minlength="6"
                                           autocomplete="new-password">
                                </div>

                                <div class="mb-3">
                                    <label for="confirmPassword" class="form-label">
                                        <i class="fas fa-lock me-1"></i> Confirmar Contraseña
                                    </label>
                                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" 
                                           required placeholder="Repite la contraseña" minlength="6"
                                           autocomplete="new-password">
                                </div>

                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="fas fa-save me-1"></i> Guardar Nueva Contraseña
                                </button>
                            </form>

                            <hr class="my-4">
                            
                            <div class="text-center">
                                <a th:href="@{/login}" class="text-decoration-none">
                                    <i class="fas fa-arrow-left me-1"></i> Volver a Iniciar Sesión
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script>
        document.getElementById('resetForm').addEventListener('submit', function(e) {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                e.preventDefault();
                alert('Las contraseñas no coinciden');
            }
        });
    </script>
</body>
</html>
