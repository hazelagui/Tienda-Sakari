<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Productos')}"></head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <section class="page-header">
        <div class="container">
            <h1><i class="fas fa-shopping-bag me-2"></i>Nuestros Productos</h1>
            <p>Encuentra productos únicos de alta calidad</p>
        </div>
    </section>

    <main class="main-content py-4">
        <div class="container">
            <!-- Filtros -->
            <div class="card mb-4">
                <div class="card-body py-3">
                    <form th:action="@{/productos}" method="get" class="row g-2 align-items-end">
                        <div class="col-md-4">
                            <label for="categoria" class="form-label small">Categoría</label>
                            <select name="categoria" id="categoria" class="form-select form-select-sm">
                                <option value="">Todas las categorías</option>
                                <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nombre}"
                                        th:selected="${categoriaId != null and categoriaId == cat.id}">Categoría</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="buscar" class="form-label small">Buscar</label>
                            <input type="text" name="buscar" id="buscar" class="form-control form-control-sm" 
                                   placeholder="Nombre del producto..." th:value="${buscar}">
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary btn-sm w-100">
                                <i class="fas fa-search me-1"></i>Filtrar
                            </button>
                        </div>
                        <div class="col-md-2">
                            <a th:href="@{/productos}" class="btn btn-secondary btn-sm w-100">
                                <i class="fas fa-times me-1"></i>Limpiar
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Productos -->
            <div th:if="${productos != null and !productos.isEmpty()}" class="products-grid">
                <div th:each="producto : ${productos}" class="product-card">
                    <div class="product-image">
                        <img th:src="${producto.imagenUrl}" th:alt="${producto.nombre}" 
                             onerror="this.src='https://via.placeholder.com/400x400?text=Sakari'">
                        <span th:if="${producto.personalizable}" class="product-badge">
                            <i class="fas fa-magic me-1"></i>Personalizable
                        </span>
                    </div>
                    <div class="product-info">
                        <span class="product-category" th:text="${producto.categoria?.nombre ?: 'General'}">Categoría</span>
                        <h3 class="product-title" th:text="${producto.nombre}">Producto</h3>
                        <p class="product-price" th:text="${#numbers.formatDecimal(producto.precio, 0, 'COMMA', 0, 'POINT')} + ' ₡'">0 ₡</p>
                    </div>
                    <div class="product-actions">
                        <a th:href="@{/productos/{id}(id=${producto.id})}" class="btn btn-secondary">
                            <i class="fas fa-eye"></i> Ver
                        </a>
                        <button class="btn btn-primary btn-agregar" th:data-id="${producto.id}">
                            <i class="fas fa-cart-plus"></i> Añadir
                        </button>
                    </div>
                </div>
            </div>

            <!-- Sin productos -->
            <div th:if="${productos == null or productos.isEmpty()}" class="empty-state">
                <i class="fas fa-search"></i>
                <h2>No se encontraron productos</h2>
                <p>Intenta con otros filtros o categorías</p>
                <a th:href="@{/productos}" class="btn btn-primary">Ver Todos</a>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script>
        document.querySelectorAll('.btn-agregar').forEach(btn => {
            btn.addEventListener('click', function() {
                const productoId = this.dataset.id;
                const button = this;
                
                fetch('/carrito/agregar/' + productoId, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                })
                .then(response => {
                    if (response.redirected && response.url.includes('login')) {
                        window.location.href = response.url;
                    } else {
                        // Actualizar badge
                        fetch('/carrito/count')
                            .then(r => r.json())
                            .then(count => {
                                const badge = document.getElementById('cartCount');
                                if (badge) {
                                    badge.textContent = count;
                                    badge.style.display = 'flex';
                                }
                            });
                        
                        // Feedback visual
                        button.innerHTML = '<i class="fas fa-check"></i> Añadido';
                        button.classList.remove('btn-primary');
                        button.classList.add('btn-success');
                        
                        setTimeout(() => {
                            button.innerHTML = '<i class="fas fa-cart-plus"></i> Añadir';
                            button.classList.remove('btn-success');
                            button.classList.add('btn-primary');
                        }, 2000);
                    }
                })
                .catch(err => console.error('Error:', err));
            });
        });

        // Cargar contador inicial
        fetch('/carrito/count')
            .then(r => r.json())
            .then(count => {
                const badge = document.getElementById('cartCount');
                if (badge) {
                    badge.textContent = count;
                    badge.style.display = count > 0 ? 'flex' : 'none';
                }
            });
    </script>
</body>
</html>
