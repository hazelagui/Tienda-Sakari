<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head(${producto.nombre})}"></head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-content py-4">
        <div class="container">
            <!-- Breadcrumb -->
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}">Inicio</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/productos}">Productos</a></li>
                    <li class="breadcrumb-item active" th:text="${producto.nombre}">Producto</li>
                </ol>
            </nav>

            <div class="row g-4">
                <!-- Imagen -->
                <div class="col-lg-6">
                    <div class="card">
                        <div class="card-body p-0">
                            <img th:src="${producto.imagenUrl}" th:alt="${producto.nombre}" 
                                 class="img-fluid w-100" style="border-radius: var(--radius-lg); aspect-ratio: 1; object-fit: cover;"
                                 onerror="this.src='https://via.placeholder.com/600x600?text=Sakari'">
                        </div>
                    </div>
                </div>

                <!-- Info -->
                <div class="col-lg-6">
                    <div class="card h-100">
                        <div class="card-body">
                            <span class="badge bg-primary mb-2" th:text="${producto.categoria?.nombre ?: 'General'}">Categoría</span>
                            
                            <h1 class="h2 mb-3" th:text="${producto.nombre}">Producto</h1>
                            
                            <p class="text-muted mb-4" th:text="${producto.descripcion}">Descripción del producto</p>

                            <div class="d-flex align-items-center gap-3 mb-4">
                                <span class="fs-2 fw-bold text-primary" th:text="${#numbers.formatDecimal(producto.precio, 0, 'COMMA', 0, 'POINT')} + ' ₡'">0 ₡</span>
                                <span th:if="${producto.stock > 0}" class="badge bg-success">
                                    <i class="fas fa-check me-1"></i>En Stock
                                </span>
                                <span th:unless="${producto.stock > 0}" class="badge bg-danger">
                                    <i class="fas fa-times me-1"></i>Agotado
                                </span>
                            </div>

                            <div th:if="${producto.personalizable}" class="alert alert-info mb-4">
                                <i class="fas fa-magic me-2"></i>
                                <strong>Producto Personalizable</strong>
                                <p class="mb-0 mt-1 small">Puedes agregar tu diseño, texto o imagen personalizada.</p>
                            </div>

                            <form th:action="@{/carrito/agregar}" method="post" id="addToCartForm">
                                <input type="hidden" name="productoId" th:value="${producto.id}">
                                
                                <div class="row g-3 mb-4">
                                    <div class="col-md-4">
                                        <label class="form-label">Cantidad</label>
                                        <div class="input-group">
                                            <button type="button" class="btn btn-outline-secondary" onclick="cambiarCantidad(-1)">−</button>
                                            <input type="number" name="cantidad" id="cantidad" class="form-control text-center" 
                                                   value="1" min="1" th:max="${producto.stock}">
                                            <button type="button" class="btn btn-outline-secondary" onclick="cambiarCantidad(1)">+</button>
                                        </div>
                                    </div>
                                </div>

                                <div th:if="${producto.personalizable}" class="mb-4">
                                    <label for="personalizacion" class="form-label">Personalización</label>
                                    <textarea name="personalizacion" id="personalizacion" class="form-control" rows="2"
                                              placeholder="Describe tu personalización (texto, colores, etc.)"></textarea>
                                </div>

                                <div class="d-flex gap-2 flex-wrap">
                                    <button type="submit" class="btn btn-primary btn-lg" th:disabled="${producto.stock <= 0}">
                                        <i class="fas fa-cart-plus me-2"></i>Agregar al Carrito
                                    </button>
                                    <a th:href="@{/productos}" class="btn btn-secondary btn-lg">
                                        <i class="fas fa-arrow-left me-2"></i>Volver
                                    </a>
                                </div>
                            </form>

                            <!-- Características -->
                            <hr class="my-4">
                            <div class="row g-3">
                                <div class="col-6">
                                    <div class="d-flex align-items-center gap-2">
                                        <i class="fas fa-truck text-primary"></i>
                                        <small>Envío a todo CR</small>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="d-flex align-items-center gap-2">
                                        <i class="fas fa-shield-alt text-success"></i>
                                        <small>Garantía de calidad</small>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="d-flex align-items-center gap-2">
                                        <i class="fas fa-headset text-info"></i>
                                        <small>Soporte WhatsApp</small>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="d-flex align-items-center gap-2">
                                        <i class="fas fa-award text-warning"></i>
                                        <small>Alta calidad</small>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script>
        function cambiarCantidad(delta) {
            const input = document.getElementById('cantidad');
            let valor = parseInt(input.value) + delta;
            if (valor < 1) valor = 1;
            if (valor > parseInt(input.max)) valor = parseInt(input.max);
            input.value = valor;
        }
    </script>
</body>
</html>
