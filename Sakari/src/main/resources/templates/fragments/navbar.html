<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <span class="brand-logo">
                <i class="fas fa-tshirt"></i>
                <span class="brand-text">SAKARI</span>
                <span class="brand-sub">Sublimados</span>
            </span>
        </a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" 
                aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'inicio' ? 'active' : ''}" th:href="@{/}">
                        <i class="fas fa-home me-1"></i>Inicio
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'productos' ? 'active' : ''}" th:href="@{/productos}">
                        <i class="fas fa-box me-1"></i>Productos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'personalizaciones' ? 'active' : ''}" th:href="@{/personalizaciones}">
                        <i class="fas fa-paint-brush me-1"></i>Personalizar
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'quienes-somos' ? 'active' : ''}" th:href="@{/quienes-somos}">
                        <i class="fas fa-users me-1"></i>Nosotros
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'contacto' ? 'active' : ''}" th:href="@{/contacto}">
                        <i class="fas fa-envelope me-1"></i>Contacto
                    </a>
                </li>
            </ul>
            
            <!-- Usuario autenticado -->
            <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
                <a th:href="@{/carrito}" class="btn btn-outline-light btn-sm position-relative">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-badge" id="cartCount">0</span>
                </a>
                
                <div class="dropdown">
                    <button class="btn btn-outline-light btn-sm dropdown-toggle" type="button" 
                            data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fas fa-user-circle me-1"></i>
                        <span sec:authentication="name" class="d-none d-md-inline">Usuario</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/perfil}"><i class="fas fa-user me-2"></i>Mi Perfil</a></li>
                        <li><a class="dropdown-item" th:href="@{/perfil/pedidos}"><i class="fas fa-shopping-bag me-2"></i>Mis Pedidos</a></li>
                        <li sec:authorize="hasRole('ADMIN')">
                            <hr class="dropdown-divider">
                            <a class="dropdown-item text-primary fw-bold" th:href="@{/admin}">
                                <i class="fas fa-cog me-2"></i>Panel Admin
                            </a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="px-2 py-1">
                                <button type="submit" class="btn btn-outline-danger btn-sm w-100">
                                    <i class="fas fa-sign-out-alt me-1"></i> Cerrar Sesión
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
            
            <!-- Usuario no autenticado -->
            <div sec:authorize="!isAuthenticated()" class="d-flex gap-2">
                <a th:href="@{/login}" class="btn btn-outline-light btn-sm">
                    <i class="fas fa-sign-in-alt me-1"></i> Ingresar
                </a>
                <a th:href="@{/registro}" class="btn btn-primary btn-sm">
                    <i class="fas fa-user-plus me-1"></i> Registrarse
                </a>
            </div>
        </div>
    </div>
</nav>

<!-- Bootstrap JS necesario para el navbar -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</html>
