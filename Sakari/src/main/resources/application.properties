# =====================================================
# SAKARI - Configuración de Aplicación
# =====================================================

# Nombre de la aplicación
spring.application.name=sakari

# =====================================================
# Base de Datos MySQL
# =====================================================
spring.datasource.url=jdbc:mysql://localhost:3306/sakari_db?useSSL=false&serverTimezone=America/Costa_Rica&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================
# JPA / Hibernate
# =====================================================
# update = crea/actualiza tablas automáticamente
# create = borra y crea tablas cada vez 
# validate = solo valida, no modifica
# none = no hace nada
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Deshabilitar ejecución automática de data.sql (ejecutar manualmente)
spring.sql.init.mode=never

# =====================================================
# Thymeleaf
# =====================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# =====================================================
# Servidor
# =====================================================
server.port=8080
server.error.whitelabel.enabled=false
server.error.include-message=always

# =====================================================
# Archivos estáticos
# =====================================================
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# =====================================================
# Sesiones
# =====================================================
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true

# =====================================================
# Logging
# =====================================================
logging.level.root=INFO
logging.level.Sakari=DEBUG
logging.level.org.springframework.security=DEBUG
